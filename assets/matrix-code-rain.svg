<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: black; }
      .code {
        fill: #00ff41;
        font-family: monospace;
        font-size: 14px;
        opacity: 0.85;
      }
    </style>

    <!-- animação de queda -->
    <symbol id="rain">
      <text y="-100%" class="code" writing-mode="tb">
        1010101010101010101010101010101010101010101010101010
        <animate attributeName="y" from="-100%" to="100%" dur="6s" repeatCount="indefinite"/>
      </text>
    </symbol>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <!-- colunas -->
  <g>
    <use href="#rain" x="20"/>
    <use href="#rain" x="60"/>
    <use href="#rain" x="100"/>
    <use href="#rain" x="140"/>
    <use href="#rain" x="180"/>
    <use href="#rain" x="220"/>
    <use href="#rain" x="260"/>
    <use href="#rain" x="300"/>
    <use href="#rain" x="340"/>
    <use href="#rain" x="380"/>
    <use href="#rain" x="420"/>
    <use href="#rain" x="460"/>
    <use href="#rain" x="500"/>
    <use href="#rain" x="540"/>
    <use href="#rain" x="580"/>
    <use href="#rain" x="620"/>
    <use href="#rain" x="660"/>
    <use href="#rain" x="700"/>
    <use href="#rain" x="740"/>
    <use href="#rain" x="780"/>
    <use href="#rain" x="820"/>
    <use href="#rain" x="860"/>
    <use href="#rain" x="900"/>
    <use href="#rain" x="940"/>
    <use href="#rain" x="980"/>
    <use href="#rain" x="1020"/>
    <use href="#rain" x="1060"/>
    <use href="#rain" x="1100"/>
    <use href="#rain" x="1140"/>
  </g>
</svg>
